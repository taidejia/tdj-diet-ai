{% extends 'base.html' %}{% block content %}<div class="formwrap"><h1>初次體態評估</h1><p class="muted">先建立個人檔案。測試時「識別碼」可直接填 demo。</p><form method="post" class="formgrid"><label>識別碼<input name="external_id" value="demo" required></label><label>稱呼<input name="name"></label><label>年齡<input type="number" name="age" min="13" max="100"></label><label>性別<select name="sex"><option>女性</option><option>男性</option><option>其他/不填</option></select></label><label>身高 cm<input type="number" step="0.1" name="height"></label><label>目前體重 kg<input type="number" step="0.1" name="weight"></label><label>體脂率 %（可不填）<input type="number" step="0.1" name="body_fat"></label><label>目標體重 kg（可不填）<input type="number" step="0.1" name="target_weight"></label><label class="wide">你的主要目標<select name="goal"><option>減脂</option><option>體重下降</option><option>維持體態</option><option>增加肌肉</option><option>改善飲食規律</option></select></label><label>每日平均步數<input type="number" name="steps" placeholder="例如 3000"></label><label>一天通常吃幾餐<input type="number" name="meals_per_day" min="1" max="8"></label><label>每日飲水 ml<input type="number" name="water_ml"></label><label>平均睡眠小時<input type="number" step="0.5" name="sleep_hours"></label><label class="wide">活動型態<select name="activity"><option>幾乎整天坐著</option><option>久坐但偶爾走動</option><option>工作常站立/走動</option><option>規律運動每週1-2次</option><option>規律運動每週3次以上</option></select></label><label class="wide">健康狀況/用藥（沒有請填「無」）<textarea name="medical" placeholder="例如：無；或高血壓用藥、哺乳中等"></textarea></label><button class="btn wide" type="submit">完成評估</button></form></div>{% endblock %}
