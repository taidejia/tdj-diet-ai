{% extends "base.html" %}{% block content %}<div class="form"><span class="pill">第一次設定｜約 1 分鐘</span><h1>先算出你的每日基準。</h1><p class="choice-note">系統會依年齡、身高、體重、活動量、運動頻率與目標，估算每日熱量、蛋白質、碳水、脂肪與飲水起始目標；之後再依實際趨勢調整。</p><form method="post"><div class="panel grid"><label>怎麼稱呼你？<input name="name" required value="{{profile.get('name','')}}"></label><label>性別<select name="sex"><option value="female">女性</option><option value="male">男性</option><option value="other">其他／不回答</option></select></label><label>年齡<input name="age" type="number" min="18" max="100" required value="{{profile.get('age','')}}"></label><label>身高 cm<input name="height" type="number" step=".1" required value="{{profile.get('height','')}}"></label><label>目前體重 kg<input name="weight" type="number" step=".1" required value="{{profile.get('weight','')}}"></label><label>主要目標<select name="goal"><option>減脂</option><option>減重</option><option>維持體重</option><option>增肌改善體態</option></select></label><label>日常活動量<select name="activity_level"><option value="low">很低｜大多坐著</option><option value="light">偏低｜一般生活走動</option><option value="moderate">中等｜走動較多或規律運動</option><option value="high">高｜體力工作或高運動量</option></select></label><label>平均每日步數<input name="steps" type="number" placeholder="不知道可留白"></label><label>每週運動幾天<input name="exercise_days" type="number" min="0" max="7" value="0"></label></div><details class="panel"><summary><b>安全資料（有特殊狀況再填）</b></summary><div class="grid"><label>目前懷孕？<select name="pregnant"><option value="no">否</option><option value="yes">是</option></select></label><label>目前哺乳？<select name="breastfeeding"><option value="no">否</option><option value="yes">是</option></select></label><label class="wide">已知疾病／特殊狀況<input name="conditions"></label><label class="wide">固定藥物<input name="meds"></label><label>曾有進食障礙相關困擾？<select name="risk_eating"><option value="no">否</option><option value="yes">是／不確定</option></select></label></div></details><button class="btn">建立我的每日目標</button></form></div>{% endblock %}
