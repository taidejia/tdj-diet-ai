{% extends 'base.html' %}{% block content %}<div class="formwrap"><h1>分析這一餐</h1><form method="post" enctype="multipart/form-data" class="formgrid"><label>識別碼<input name="external_id" value="demo" required></label><label>餐別<select name="meal_type"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>宵夜</option></select></label><label class="wide">直接描述你吃了什麼<textarea name="text" placeholder="例如：半碗白飯、煎雞腿一塊、炒高麗菜、無糖茶"></textarea></label><label class="wide upload">或上傳餐點照片<input type="file" name="image" accept="image/*" capture="environment"></label><button class="btn wide" type="submit">開始分析</button></form><p class="muted">沒有 OpenAI API 金鑰時，文字分析仍可測；照片辨識需啟用 AI。</p></div>{% endblock %}
