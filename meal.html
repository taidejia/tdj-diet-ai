{% extends "base.html" %}{% block content %}<div class="form"><span class="pill">餐點紀錄</span><h1>直接寫，或拍下你真的吃的。</h1>
<p class="choice-note">照片可以估食物種類與大致份量，但無法精準知道重量、醬料和烹調油，因此不會假裝算出精確熱量。</p>
<form method="post" enctype="multipart/form-data"><div class="panel grid">
<label>這是哪一餐？<select name="meal_type"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>宵夜</option><option>其他</option></select></label>
<label>上傳餐點照片<input type="file" name="photo" accept="image/*"></label>
<label class="wide">也可以直接描述<textarea name="content" placeholder="例如：雞腿便當，飯吃半盒，青菜吃完，另外喝一杯無糖拿鐵"></textarea></label>
</div><button class="btn">分析並記錄</button></form>
{% if analysis %}<div class="panel analysis"><b>這餐的分析</b>

{{analysis}}</div>{% endif %}</div>{% endblock %}
